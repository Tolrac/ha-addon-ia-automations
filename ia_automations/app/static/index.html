<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automations IA</title>
  <link rel="stylesheet" href="static/style.css?v=1.2.3">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="11" rx="3"/><path d="M12 8V4.5M9.5 4.5h5"/><circle cx="9" cy="13.5" r="1.3" fill="#fff"/><circle cx="15" cy="13.5" r="1.3" fill="#fff"/><path d="M9.5 16.5h5"/></svg>
      </div>
      <div class="header-text">
        <h1 class="truncate">Automations IA</h1>
        <p class="truncate">Décrivez une automatisation en une phrase, l'IA rédige les étapes</p>
      </div>
      <div class="header-spacer"></div>
      <span id="status-line" class="header-status truncate">Chargement…</span>
      <button id="header-menu" class="header-actions" type="button" aria-label="Plus d'options">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </header>

    <div id="banner" class="banner hidden" role="alert"></div>

    <div class="layout">
      <section class="col chat" aria-label="Conversation">
        <div id="thread" class="thread"></div>
        <div class="composer">
          <div class="prompt-box">
            <textarea id="prompt" rows="2" placeholder="Décris l'automatisation en une phrase…" maxlength="1500"></textarea>
            <button id="send" class="send" type="button" aria-label="Envoyer">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </section>

      <section id="result" class="col result" aria-label="Résultat"></section>
    </div>

    <div class="fab-container">
      <button id="new-chat" class="fab-btn" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nouvelle automatisation
      </button>
    </div>

    <div id="toast-zone"></div>
  </div>

  <div id="menu" class="menu hidden"></div>
  <div id="dialog" class="dialog-back hidden"></div>
  <script src="static/app.js?v=1.2.3"></script>
</body>
</html>
